procs:
  deps:compose:
    autostart: true
    autorestart: false
    cmd:
      - docker
      - compose
      - -f
      - docker-compose.dev.yml
      - up
    stop:
      send-keys:
        - <C-c>

  # mjml:
  #   autostart: true
  #   autorestart: false
  #   cmd:
  #     - npx
  #     - mjml
