procs:
  deps:compose:
    autostart: true
    autorestart: false
    cmd:
      - docker
      - compose
      - -f
      - docker-compose.dev.yml
      - up
    stop:
      send-keys:
        - <C-c>
  esbuild:
    autostart: true
    autorestart: false
    cmd:
      - npm
      - run
      - esbuild:watch
    stop:
      send-keys:
        - <C-c>
  tailwindcss:
    autostart: true
    autorestart: false
    cmd:
      - npm
      - run
      - tailwind:watch
    stop:
      send-keys:
        - <C-c>
  runserver:
    autostart: true
    autorestart: false
    cmd:
      - uv
      - run
      - ./manage.py
      - runserver_plus
    stop:
      send-keys:
        - <C-c>
