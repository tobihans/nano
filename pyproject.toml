[project]
name = "nano"
version = "0.1.0"
classifiers = ["Private :: Do Not Upload"]
description = "A minimal django template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2.5",
  "django-extensions>=4.1",
  "mrml>=0.2.0",
  "pydantic-settings>=2.10.1",
]
[dependency-groups]
dev = [
  "django-browser-reload>=1.18.0",
  "django-debug-toolbar>=6.0.0",
  "django-stubs>=6.0.4",
  "werkzeug>=3.1.3",
]


[tool.djlint]
indent = 2
max_blank_lines = 4
max_line_length = 120
profile = "django"
use_gitignore = true

[tool.pyrefly]
python_interpreter = ".venv/bin/python"
errors.missing-attribute = "warn"
