{% load mjml %}{% mjml %}
<mjml>
  <mj-head>
    <mj-title>Reset your password</mj-title>
    <mj-attributes>
      <mj-all font-family="Arial, sans-serif" />
      <mj-text font-size="14px" color="#333333" line-height="1.6" />
      <mj-button background-color="#3b82f6" color="#ffffff" font-size="14px" border-radius="6px" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f3f4f6">
    <mj-section background-color="#ffffff" padding="30px 20px">
      <mj-column>
        <mj-text font-size="20px" font-weight="bold" align="center">{{ site_name }}</mj-text>
        <mj-text>Hi,</mj-text>
        <mj-text>You requested a password reset. Click the button below to set a new password:</mj-text>
        <mj-button href="{{ protocol }}://{{ domain }}{% url 'auth:password-reset-confirm' uidb64=uid token=token %}">Reset Password</mj-button>
        <mj-text font-size="12px" color="#6b7280">If you didn't request this, you can ignore this email.</mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
{% endmjml %}
