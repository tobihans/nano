{% load mjml %}
{% mjml %}
  <mjml>
    <mj-head>
      <mj-title>Verify your email</mj-title>
      <mj-attributes>
        <mj-all font-family="Arial, sans-serif" />
        <mj-text font-size="14px" color="#333333" line-height="1.6" />
        <mj-button background-color="#3b82f6" color="#ffffff" font-size="14px" border-radius="6px" />
      </mj-attributes>
    </mj-head>
    <mj-body background-color="#f3f4f6">
      <mj-section background-color="#ffffff" padding="30px 20px">
        <mj-column>
          <mj-text font-size="20px" font-weight="bold" align="center">{{ site_name }}</mj-text>
          <mj-text>Hi,</mj-text>
          <mj-text>Please verify your email address by clicking the button below:</mj-text>
          <mj-button href="{{ verify_url }}">Verify Email</mj-button>
          <mj-text font-size="12px" color="#6b7280">If you didn't create an account, you can ignore this email.</mj-text>
        </mj-column>
      </mj-section>
    </mj-body>
  </mjml>
{% endmjml %}
