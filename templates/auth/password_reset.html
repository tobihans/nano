{% extends "_base.html" %}

{% block head_title %}Reset Password{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold">Reset your password</h1>
      <p class="text-muted-foreground text-sm mt-1">We'll send you a link to reset it</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% include "partials/_form_fields.html" with form=form %}
      <button type="submit" class="btn btn-primary w-full">Send Reset Link</button>
    </form>

    <p class="text-center text-sm text-muted-foreground">
      <a href="{% url 'auth:login' %}" class="underline">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
