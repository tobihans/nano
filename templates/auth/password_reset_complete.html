{% extends "_base.html" %}

{% block head_title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-6 text-center">
    <h1 class="text-2xl font-bold">Password reset complete</h1>
    <p class="text-muted-foreground text-sm">Your password has been set. You can now log in.</p>
    <a href="{% url 'auth:login' %}" class="btn btn-primary inline-block">Log In</a>
  </div>
</div>
{% endblock %}
