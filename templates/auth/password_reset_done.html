{% extends "_base.html" %}

{% block head_title %}Check Your Email{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-6 text-center">
    <h1 class="text-2xl font-bold">Check your email</h1>
    <p class="text-muted-foreground text-sm">If an account with that email exists, we've sent a password reset link.</p>
    <p class="text-sm"><a href="{% url 'auth:login' %}" class="underline">Back to login</a></p>
  </div>
</div>
{% endblock %}
